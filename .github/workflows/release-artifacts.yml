name: Build and Attach Release Artifacts

on:
  release:
    types: [published]

jobs:
  build-and-attach:
    name: Build and attach artifacts
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish CLI (portable)
      run: dotnet publish src/DecompileForge.Cli/DecompileForge.Cli.csproj -c Release -o ${{ runner.temp }}/artifacts/DecompileForge.Cli

    - name: Publish CLI (self-contained win-x64 single-file)
      run: |
        dotnet publish src/DecompileForge.Cli/DecompileForge.Cli.csproj -c Release -r win-x64 \
          -p:PublishSingleFile=true -p:SelfContained=true -p:PublishTrimmed=true \
          -o ${{ runner.temp }}/artifacts/installers/DecompileForge.Cli.win-x64

    - name: Publish WPF (portable)
      run: dotnet publish src/DecompileForge.Wpf/DecompileForge.Wpf.csproj -c Release -o ${{ runner.temp }}/artifacts/DecompileForge.Wpf

    - name: Publish WPF (self-contained win-x64 single-file)
      run: |
        dotnet publish src/DecompileForge.Wpf/DecompileForge.Wpf.csproj -c Release -r win-x64 \
          -p:PublishSingleFile=true -p:SelfContained=true -p:PublishTrimmed=true \
          -o ${{ runner.temp }}/artifacts/installers/DecompileForge.Wpf.win-x64

    - name: Archive release artifacts (portable outputs)
      run: |
        powershell -NoProfile -Command "Compress-Archive -Path '${{ runner.temp }}\\artifacts\\DecompileForge.Cli','${{ runner.temp }}\\artifacts\\DecompileForge.Wpf' -DestinationPath '${{ runner.temp }}\\release-artifacts.zip' -Force"

    - name: Archive installers (self-contained single-file builds)
      run: |
        powershell -NoProfile -Command "Compress-Archive -Path '${{ runner.temp }}\\artifacts\\installers\\*' -DestinationPath '${{ runner.temp }}\\installers.zip' -Force"

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ runner.temp }}/release-artifacts.zip
          ${{ runner.temp }}/installers.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
